[project]
name = "meu-primeiro-etl"
version = "0.1.0"
description = "Pipeline ETL que lê arquivos CSV locais e carrega os dados no SQL Server"
authors = [
    {name = "vini-bgs",email = "viniciustheros@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = "3.14.5"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "pyodbc (>=5.3.0,<6.0.0)",
    "loguru (>=0.7.3,<0.8.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.0,<5.0.0)"
]

[tool.flake8]
max-line-length = 88
